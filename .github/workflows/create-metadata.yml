name: Generate Verification Metadata

on:
  workflow_dispatch:

jobs:
  generate-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Generate dummy keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storetype PKCS12 -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "RELEASE_KEYSTORE=${{ github.workspace }}/debug.keystore" >> $GITHUB_ENV
          echo "RELEASE_KEY_ALIAS=androiddebugkey" >> $GITHUB_ENV
          echo "RELEASE_KEY_PASSPHRASE=android" >> $GITHUB_ENV
          echo "RELEASE_KEYSTORE_PASSPHRASE=android" >> $GITHUB_ENV

      # FIX: Removed --dry-run and added mergeReleaseNativeLibs
      # We rely on --write-verification-metadata to suppress errors while it updates the file.
      - name: Generate Metadata XML
        run: |
          ./gradlew --write-verification-metadata sha512 \
            help \
            zipRelease \
            lintVitalAnalyzeRelease \
            test \
            :app:mergeReleaseNativeLibs

      - name: Upload Verification Metadata
        uses: actions/upload-artifact@v4
        with:
          name: verification-metadata
          path: gradle/verification-metadata.xml
